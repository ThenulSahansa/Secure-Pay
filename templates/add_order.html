{% extends 'base.html' %}

{% block title %}Add Order - SecurePay{% endblock %}
{% block page_title %}Add New Order{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2>Create Order Record</h2>
    <p style="margin-bottom: 20px; color: #636e72;">Create a pending order to be verified against a payment slip.</p>
    
    <form action="{{ url_for('add_order') }}" method="POST">
        <div class="row">
            <div class="col form-group">
                <label for="account_no">Account Number (Required)</label>
                <input type="text" name="account_no" id="account_no" class="form-control" required placeholder="e.g. 123456789">
            </div>
            
            <div class="col form-group">
                <label for="amount">Amount in LKR (Required)</label>
                <input type="number" step="0.01" name="amount" id="amount" class="form-control" required placeholder="0.00">
            </div>
        </div>
        
        <div class="row">
            <div class="col form-group">
                <label for="date_time">Expected Date/Time</label>
                <input type="datetime-local" name="date_time" id="date_time" class="form-control">
            </div>
            
            <div class="col form-group">
                <label for="customer_name">Customer Name</label>
                <input type="text" name="customer_name" id="customer_name" class="form-control" placeholder="John Doe">
            </div>
        </div>
        
        <div class="row">
            <div class="col form-group">
                <label for="reference">Order Reference</label>
                <input type="text" name="reference" id="reference" class="form-control" placeholder="e.g. ORD-12345">
            </div>
            
            <div class="col form-group">
                <label for="expires_at">Expires At</label>
                <input type="datetime-local" name="expires_at" id="expires_at" class="form-control">
            </div>
        </div>
        
        <div style="margin-top: 20px; text-align: right;">
            <button type="reset" class="btn" style="background: #dfe6e9; color: var(--dark); margin-right: 10px;">Clear Form</button>
            <button type="submit" class="btn btn-primary">Create Order</button>
        </div>
    </form>
</div>
{% endblock %}
